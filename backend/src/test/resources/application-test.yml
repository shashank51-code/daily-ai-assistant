spring:
  datasource:
    url: jdbc:h2:mem:dailyai_phase7;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  task:
    scheduling:
      enabled: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: DAILYAI_SESSION
        http-only: true
        secure: false
        same-site: lax

app:
  admin-api-key: test-admin-key
  rss:
    fetch-on-startup: false
  auth:
    max-login-attempts: 5
    login-window-minutes: 15
