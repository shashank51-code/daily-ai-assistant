spring:
  application:
    name: daily-ai-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dailyai}
    username: ${DB_USERNAME:dailyai}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.dailyai.assistant: INFO
    com.dailyai.assistant.integration: DEBUG

app:
  timezone: Asia/Kolkata
  admin-api-key: ${ADMIN_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://localhost,capacitor://localhost,https://localhost}
  rss:
    user-agent: "${RSS_USER_AGENT:DailyAiAssistant/1.0 (learning project; contact: student@example.com)}"
    connect-timeout-ms: 8000
    read-timeout-ms: 12000
    max-items-per-feed: 30
    fetch-on-startup: ${RSS_FETCH_ON_STARTUP:true}
    feeds:
      - name: OpenAI News
        url: https://openai.com/news/rss.xml
        category: generative-ai
      - name: Google DeepMind
        url: https://deepmind.google/blog/rss.xml
        category: ai-research
      - name: Google AI Blog
        url: https://blog.google/technology/ai/rss/
        category: machine-learning
      - name: Hugging Face Blog
        url: https://huggingface.co/blog/feed.xml
        category: ai-tools
      - name: TechCrunch AI
        url: https://techcrunch.com/category/artificial-intelligence/feed/
        category: ai-startups
      - name: arXiv cs.AI
        url: https://export.arxiv.org/rss/cs.AI
        category: ai-research
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-ms: ${AI_TIMEOUT_MS:30000}
    # Transient failures (429/5xx/timeouts) are retried with bounded exponential backoff.
    max-attempts: ${AI_MAX_ATTEMPTS:2}
    retry-delay-ms: ${AI_RETRY_DELAY_MS:1000}
    # After this many consecutive failures the provider is skipped for the cooldown,
    # so article pages keep loading instantly while the provider is down.
    failure-threshold: ${AI_FAILURE_THRESHOLD:2}
    cooldown-ms: ${AI_COOLDOWN_MS:300000}
