services:
  db:
    image: postgres:16-alpine
    container_name: dailyai-db
    environment:
      POSTGRES_DB: ${DB_NAME:-dailyai}
      POSTGRES_USER: ${DB_USERNAME:-dailyai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dailyai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dailyai} -d ${DB_NAME:-dailyai}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: dailyai-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-dailyai}
      DB_USERNAME: ${DB_USERNAME:-dailyai}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      SERVER_PORT: 8080
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-8h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_ROLE: ${BOOTSTRAP_ROLE:-USER}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,capacitor://localhost}
      RSS_FETCH_ON_STARTUP: ${RSS_FETCH_ON_STARTUP:-true}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-2}
      AI_RETRY_DELAY_MS: ${AI_RETRY_DELAY_MS:-1000}
      AI_FAILURE_THRESHOLD: ${AI_FAILURE_THRESHOLD:-2}
      AI_COOLDOWN_MS: ${AI_COOLDOWN_MS:-300000}
      AI_MAX_CALLS_PER_DAY: ${AI_MAX_CALLS_PER_DAY:-100}
      AI_RETRY_AFTER_MINUTES: ${AI_RETRY_AFTER_MINUTES:-360}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: dailyai-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  dailyai-pgdata:
